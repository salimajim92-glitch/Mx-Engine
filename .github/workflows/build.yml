name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip *.zip
          rm *.zip
        fi

    - name: Find Project Root
      run: |
        if [ -f "gradlew" ]; then
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        else
          DIR=$(find . -maxdepth 3 -name gradlew -type f | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ${{ env.PROJECT_DIR }}

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: ${{ env.PROJECT_DIR }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Mod-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
